name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Tests/HMRC-TAX-FLOW.Tests/HMRC-TAX-FLOW.Tests.csproj

      - name: Check application formatting
        run: dotnet format HMRC-TAX-FLOW.csproj --verify-no-changes --no-restore

      - name: Check test formatting
        run: dotnet format Tests/HMRC-TAX-FLOW.Tests/HMRC-TAX-FLOW.Tests.csproj --verify-no-changes --no-restore

      - name: Build application
        run: dotnet build HMRC-TAX-FLOW.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Tests/HMRC-TAX-FLOW.Tests/HMRC-TAX-FLOW.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
